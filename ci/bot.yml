# CheaterFlag demo-link bot, run for free on GitHub's servers every 5 minutes.
# Each run works for ~4.5 minutes, so there's almost always a bot online. Your PC isn't needed.
# Secrets (set by `npm run cloud-bot`): BOT_REFRESH_TOKEN, BOT_SECRET
name: bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write   # only for the keep-alive commit below
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: bot
        run: npm install --no-fund --no-audit --silent
      - name: Run bot
        working-directory: bot
        env:
          BOT_REFRESH_TOKEN: ${{ secrets.BOT_REFRESH_TOKEN }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
        run: node index.js --once
      # GitHub pauses scheduled jobs in repos with no activity for 60 days; an empty commit every ~45 days prevents that.
      - name: Keep schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "cheaterflag-bot"
            git config user.email "cheaterflag-bot@users.noreply.github.com"
            git commit --allow-empty -m "keep bot schedule active"
            git push
          fi
