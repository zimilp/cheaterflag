# Builds the Windows installer on GitHub's free runners and publishes it to Releases.
# Trigger: push a tag like v0.1.0  (git tag v0.1.0 && git push --tags)
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: app
        run: npm install --no-fund --no-audit
      - name: Test
        working-directory: app
        run: npm test
      - name: Build and publish installer
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
